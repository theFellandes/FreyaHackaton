[project]
name = "freya-collections-builder"
version = "0.1.0"
description = "LangGraph builder that reads a bank collections brief and its tool API file and creates a Freya phone agent (Build the Builder hackathon)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  # --- orchestration ---
  "langgraph>=1.2.12,<1.3",
  "langchain-core>=1.6,<2",
  # --- LLM providers (the key changer rotates across these) ---
  "langchain-anthropic>=1.7.5,<2",
  "langchain-openai>=1.0,<2",
  "anthropic>=0.120",
  "openai>=2.0",
  # --- models, config, templating ---
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "jinja2>=3.1.6",
  "pyyaml>=6.0",
  "tenacity>=9.0",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.50,<2",
]
agentic = [
  # Agentic fallback track (Claude Agent SDK, same approach as the kit's examples/agent_builder.py)
  "claude-agent-sdk>=0.1",
]
ingest = [
  # Raw bank material in PDF form
  "pypdf>=5.0",
]
obs = [
  # Optional LLM observability (Langfuse cloud or self-hosted); the local JSONL log needs nothing extra
  "langfuse>=3",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
freya-builder = "builder.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["builder"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:langsmith"
markers = [
  "live: talks to Freya staging or a real LLM (spends credits); opt-in with -m live",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "freya.py", "tools", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
